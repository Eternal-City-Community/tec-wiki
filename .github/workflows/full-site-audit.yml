name: Full site acceptance audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-site-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Crawl and safely normalize site
        run: python tools/full_site_audit.py
