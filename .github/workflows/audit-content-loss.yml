name: Audit migration content loss

on:
  push:
    paths:
      - "tools/audit_content_loss.py"
      - ".github/workflows/audit-content-loss.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compare original import to current pages
        run: python tools/audit_content_loss.py
      - name: Commit audit report
        run: |
          git config user.name "tec-wiki-audit"
          git config user.email "actions@users.noreply.github.com"
          git add CONTENT_LOSS_AUDIT.md CONTENT_LOSS_AUDIT.json
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Audit migrated pages for content loss"
            git pull --rebase origin main
            git push
          fi
