name: Import Wikidot attachments

on:
  workflow_dispatch:
  push:
    paths:
      - "migration/tec-full.part-06"
      - "tools/import_wikidot_attachments.py"
      - ".github/workflows/import-attachments.yml"

permissions:
  contents: write

jobs:
  attachments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require all split archive parts
        run: |
          for i in 00 01 02 03 04 05 06; do
            test -f "migration/tec-full.part-$i" || { echo "Missing migration/tec-full.part-$i"; exit 1; }
          done
      - name: Import attachments and rewrite image links
        run: python tools/import_wikidot_attachments.py
      - name: Audit migrated wiki
        run: python tools/audit_migration.py
      - name: Commit attachments
        run: |
          git config user.name "tec-wiki-attachments"
          git config user.email "actions@users.noreply.github.com"
          git add docs ATTACHMENT_MIGRATION_REPORT.md WIKI_AUDIT.md
          git commit -m "Import Wikidot attachments and localize assets"
          git pull --rebase origin main
          git push
