name: Protect Player Biographies

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  protect-player-biographies:
    name: Review player biography changes
    runs-on: ubuntu-latest
    steps:
      - name: Flag biography and portrait changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100
            });
            const protectedFile = /^docs\/bio_[a-z0-9_]+\.md$|^docs\/assets\/uploads\/bio_[a-z0-9_]+\.(?:png|jpg|jpeg|webp)$/;
            const affected = files.filter(f => protectedFile.test(f.filename) ||
              (f.previous_filename && protectedFile.test(f.previous_filename)));
            const marker = '<!-- tec-biography-pr-review -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (!affected.length) {
              if (existing) await github.rest.issues.deleteComment({
                ...context.repo, comment_id: existing.id
              });
              core.info('No player biography changes in this PR.');
              return;
            }
            const body = [
              marker,
              '⚠️ **Player biography ownership review required**',
              '',
              'This pull request changes player-managed biography files or portraits:',
              ...affected.map(f => '- ' + f.filename),
              '',
              '**Maintainers:** Do not merge until you independently verify the character owner authorized these changes, or a wiki administrator explicitly approves an exception. A GitHub account is not proof of in-game character ownership.',
              '',
              'Players should normally use [Edit Bio](https://tec-wiki.com/edit-bio/) with their private editing code. Never request or post editing codes in this PR.',
              '',
              'This is a review warning, not automatic ownership verification.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number, body
              });
            }
            core.warning('Player biography changes require manual ownership review.');
