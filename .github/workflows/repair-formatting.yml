name: Repair migrated formatting

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/repair_migrated_formatting.py"
      - ".github/workflows/repair-formatting.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Repair obvious migration formatting damage
        run: python tools/repair_migrated_formatting.py
      - name: Commit repairs
        run: |
          git config user.name "tec-wiki-repair"
          git config user.email "actions@users.noreply.github.com"
          git add docs FORMAT_REPAIR_REPORT.md
          if git diff --cached --quiet; then
            echo "No formatting repairs needed."
          else
            git commit -m "Repair bulk Wikidot formatting issues"
            git push
          fi
