name: Biography regression tests

on:
  push:
    branches: [main]
    paths:
      - 'src/bio-*.js'
      - 'src/worker.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/biography-tests.yml'
  pull_request:
    paths:
      - 'src/bio-*.js'
      - 'src/worker.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/biography-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  biography-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run biography regression tests
        run: npm run test:bio
