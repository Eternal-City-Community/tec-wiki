name: Import Wikidot backup

on:
  workflow_dispatch:
  push:
    paths:
      - "migration/tec-wikidot-source-only.zip"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Convert Wikidot pages
        run: python tools/migrate_wikidot_backup.py migration/tec-wikidot-source-only.zip --docs docs

      - name: Commit migrated pages
        run: |
          git config user.name "tec-wiki-migration"
          git config user.email "actions@users.noreply.github.com"
          git add docs MIGRATION_REPORT.md
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Import Wikidot pages"
            git push
          fi
