backend:
  name: github
  repo: Eternal-City-Community/tec-wiki
  branch: main
  open_authoring: true
  base_url: https://tec-wiki.com
  auth_endpoint: /auth

publish_mode: editorial_workflow

site_url: https://tec-wiki.com
display_url: https://tec-wiki.com
logo_url: https://tec-wiki.com/favicon.ico

media_folder: docs/assets/uploads
public_folder: /assets/uploads

collections:
  - name: pages
    label: Wiki Pages
    label_singular: Wiki Page
    folder: docs
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: ["title", "category", "commit_date"]
    view_groups:
      - label: Category
        field: category
    view_filters:
      - label: Character Bios
        field: category
        pattern: "^Character Bios$"
      - label: Skills & Combat
        field: category
        pattern: "^Skills & Combat$"
      - label: World & Maps
        field: category
        pattern: "^World & Maps$"
      - label: Crafting & Trade
        field: category
        pattern: "^Crafting & Trade$"
      - label: Items & Economy
        field: category
        pattern: "^Items & Economy$"
      - label: Guides & Commands
        field: category
        pattern: "^Guides & Commands$"
      - label: Lore & Community
        field: category
        pattern: "^Lore & Community$"
      - label: Wiki & Help
        field: category
        pattern: "^Wiki & Help$"
      - label: Archive
        field: category
        pattern: "^Archive$"
      - label: Reference
        field: category
        pattern: "^Reference$"
    slug: "{{slug}}"
    # Makes "View Live" open the page being edited instead of the homepage.
    preview_path: "{{slug}}/"
    editor:
      preview: true
    fields:
      - label: Title
        name: title
        widget: string
        required: false
        hint: Optional metadata title. The visible page heading can also remain in the body.
      - label: Body
        name: body
        widget: markdown
      - label: Category
        name: category
        widget: select
        options:
          - Character Bios
          - Skills & Combat
          - World & Maps
          - Crafting & Trade
          - Items & Economy
          - Guides & Commands
          - Lore & Community
          - Wiki & Help
          - Archive
          - Reference
        default: Reference
        hint: Used only to organize pages in the editor. It does not change the page URL.
      - label: Parent page
        name: parent
        widget: tec-parent
        required: false
        hint: The page this one sits under, e.g. Skills for a skill page. It sets the breadcrumb links at the top of the page; leave empty for none.
