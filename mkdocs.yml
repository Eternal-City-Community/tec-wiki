site_name: The Eternal City Wiki
site_description: Community-maintained wiki for The Eternal City MUD
site_url: "https://tec-wiki.com"

theme:
  name: material
  custom_dir: overrides
  favicon: assets/images/favicon.gif
  variant: classic
  features:
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.action.edit

nav:
  - Home: index.md
  - Getting Started:
      - Getting Started: getting-started.md
      - Account: account.md
      - Character Creation: characters.md
      - Traits: traits.md
      - Stats: stats.md
      - Newbie Guides: newbie-guides.md
  - Game World:
      - Game World: game-world.md
      - Maps: maps.md
      - Shops: shops.md
      - Organizations: orgs.md
  - Skills:
      - Skills Overview: skills.md
      - Combat Overview: combat-overview.md
      - Armor: armor.md
      - Weapons: weapons.md
      - Jewelry: jewelry.md
      - Leatherworking: leather-working.md
  - Community:
      - Character Bios: character-bios.md
      - In-Game News: in-game-news.md
      - What's New: whats-new.md
      - About the Wiki: about.md
      - Browser Editing: browser-editing.md

plugins:
  - search

# TEC internal links intentionally use root-relative URLs such as /skills/.
# Silence only MkDocs' absolute-link diagnostics; keep broken/missing-link
# validation and all other build diagnostics enabled.
validation:
  absolute_links: ignore

hooks:
  - hooks/listpages.py
  - hooks/breadcrumbs.py
  - hooks/preview_assets.py
  - hooks/placeholders.py
  - hooks/list_spacing.py
  - hooks/skill_samples.py
  - hooks/whats_new.py
  - hooks/shops.py

markdown_extensions:
  - admonition
  - fenced_code
  - attr_list
  - md_in_html
  - nl2br
  - tables
  - toc:
      permalink: true
      title: Table of Contents
      toc_depth: "2-6"

extra_css:
  - stylesheets/tec.css
  - stylesheets/tec-crafting-calculator.css

extra_javascript:
  - javascripts/tec-page-enhancers.js
  - javascripts/tec-table-cells.js
  - javascripts/tec-nav-v2.js
  - javascripts/tec-sidebar.js
  - javascripts/tec-skill-pages.js
  - javascripts/tec-veteran-tabs.js
  - javascripts/tec-rank-bonus.js
  - javascripts/tec-money-calculator.js
  - javascripts/tec-crafting-calculator.js
  - javascripts/tec-national-lores.js
  - javascripts/tec-stats.js
  - javascripts/tec-shops.js
  - javascripts/tec-tables.js
  - javascripts/tec-content.js
  - javascripts/tec-page-history.js
  - javascripts/tec-whats-new.js
