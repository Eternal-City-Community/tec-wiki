site_name: The Eternal City Wiki
site_description: Community-maintained wiki for The Eternal City MUD
site_url: "https://tec-wiki.tecwiki.workers.dev"

theme:
  name: material
  variant: classic
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit

nav:
  - Home: index.md
  - Getting Started:
      - Getting Started: getting-started.md
      - Account: account.md
      - Character Creation: characters.md
      - Traits: traits.md
      - Stats: stats.md
      - Newbie Guides: newbie-guides.md
  - Game World:
      - Game World: game-world.md
      - Maps: maps.md
      - Shops: shops.md
      - Organizations: orgs.md
  - Skills:
      - Skills Overview: skills.md
      - Combat Overview: combat-overview.md
      - Armor: armor.md
      - Weapons: weapons.md
      - Jewelry: jewelry.md
      - Leatherworking: leather-working.md
  - Community:
      - Character Bios: character-bios.md
      - In-Game News: in-game-news.md
      - About the Wiki: about.md
      - Browser Editing: browser-editing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/tec.css

extra_javascript:
  - javascripts/tec-nav.js
  - javascripts/tec-sidebar.js
  - javascripts/tec-skill-pages.js
