site_name: The Eternal City Wiki
site_description: Community-maintained wiki for The Eternal City MUD
site_url: ""

theme:
  name: material
  variant: classic
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit

nav:
  - Home: index.md
  - Game World:
      - Armor: armor.md
  - Crafting:
      - Jewelry Crafting: crafting/jewelry.md
      - Leatherworking: crafting/leatherworking.md
  - Mechanics:
      - Combat: mechanics/combat.md
  - Wiki:
      - About: about.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/tec.css
