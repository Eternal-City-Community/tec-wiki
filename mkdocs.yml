site_name: The Eternal City Wiki
site_description: Community-maintained wiki for The Eternal City MUD
site_url: ""

theme:
  name: material
  # Zensical's classic variant preserves Material for MkDocs structure and
  # styling compatibility while we build the custom TEC parchment theme.
  variant: classic
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit

nav:
  - Home: index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/tec.css
